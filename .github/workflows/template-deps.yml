# What this is: weekly automation that keeps the action versions pinned in
# shipshape's TEMPLATES current. Dependabot can't parse .tmpl files, so this
# runs scripts/bump_actions.py, re-renders the kit's own managed workflows,
# and opens a pull request with the result (Lane 3 of the kit's PR policy:
# automation proposes, CI checks, a human merges).
#
# Caveat: pull requests created with the built-in github.token do not trigger
# CI runs (a GitHub safeguard). Close and reopen the PR to kick CI off, or
# store a personal access token as the ACTIONS_PAT repo secret to make the
# loop fully hands-off.
name: Template deps

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bump pinned action versions in templates and own workflows
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/bump_actions.py templates .github/workflows/ci.yml .github/workflows/template-deps.yml --apply > /tmp/bump.json
          cat /tmp/bump.json
          count=$(python3 -c "import json; print(len(json.load(open('/tmp/bump.json'))['bumps']))")
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Re-render managed workflows from the bumped templates
        if: steps.bump.outputs.count != '0'
        run: python3 scripts/render.py apply .
      - name: Open a pull request with the bumps
        if: steps.bump.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/bump-pinned-actions-$(date +%Y%m%d)"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: bump pinned action versions"
          git push -u origin "$branch"
          gh pr create \
            --title "chore: bump pinned action versions" \
            --body "$(printf 'Automated weekly bump of the GitHub Action versions pinned in templates/ and the kit workflows, generated by scripts/bump_actions.py.\n\nBumps applied:\n\n```\n%s\n```' "$(cat /tmp/bump.json)")"
