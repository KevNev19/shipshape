# Repo-local automation (not part of the shipshape kit's templates): every
# Monday, gather the raw security and quality data for this repository and
# update one rolling issue. The security-quality custom agent
# (.github/agents/security-quality.md) writes the prioritized report.
#
# Dependabot alerts are read with the workflow token (vulnerability-alerts:
# read). Secret-scanning alerts and Copilot assignment cannot use that token.
# Both need the ACTIONS_PAT repository secret: a personal access token for a
# repository administrator who has Copilot.
#   classic: repo scope (security_events is enough for the secret-scanning
#     read on a public repository; assignment needs repo)
#   fine-grained: Secret scanning alerts Read; Metadata Read; Issues,
#     Contents, and Pull requests Read and write
# The token's user also needs the Copilot coding agent enabled for this
# repository. Without the secret, the rolling issue is still updated. Secret
# scanning says the data was unavailable, and the agent can be handed the
# issue manually:
#   gh agent-task create --custom-agent security-quality -F <issue-body>
name: Security & quality report

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: read
  vulnerability-alerts: read
  actions: read

jobs:
  gather-and-assign:
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.ACTIONS_PAT != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Gather alert and CI data
        env:
          # The workflow token reads code scanning, Dependabot, Actions, and
          # pull requests. ACTIONS_PAT, when set, is used only for secret
          # scanning, which the workflow token cannot read.
          GH_TOKEN: ${{ github.token }}
          ACTIONS_PAT: ${{ secrets.ACTIONS_PAT }}
          REPO: ${{ github.repository }}
        run: |
          assignment_status=manual_handoff
          if [ "$HAS_PAT" = "true" ]; then
            assignment_status=requested
          fi
          python3 scripts/security_report.py \
            --repo "$REPO" \
            --root . \
            --assignment-status "$assignment_status" \
            > "$RUNNER_TEMP/security-quality-report.json"
          python3 - "$RUNNER_TEMP/security-quality-report.json" \
            "$RUNNER_TEMP/security-quality-report.md" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          Path(sys.argv[2]).write_text(report["body"], encoding="utf-8")
          print(json.dumps({"status": report["status"], "ok": report["ok"]}))
          PY
      - name: Update the rolling report issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          label="security-quality"
          title="Security & quality report"
          if ! gh label view "$label" --repo "$REPO" >/dev/null 2>&1; then
            gh label create "$label" --repo "$REPO" --color "B60205" \
              --description "Weekly security and quality report"
          fi
          set +e
          issue_number="$(gh issue list --repo "$REPO" --state open --label "$label" \
            --json number,title --limit 100 \
            --jq '[.[] | select(.title == "Security & quality report") | .number] | first // empty')"
          list_status=$?
          set -e
          if [ "$list_status" -ne 0 ]; then
            echo "open report issues could not be listed" >&2
            exit 1
          fi
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --repo "$REPO" \
              --body-file "$RUNNER_TEMP/security-quality-report.md"
          else
            url=$(gh issue create --repo "$REPO" \
              --title "$title" \
              --label "$label" \
              --body-file "$RUNNER_TEMP/security-quality-report.md")
            issue_number="${url##*/}"
          fi
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"
      - name: Assign to the security-quality agent (needs ACTIONS_PAT)
        if: ${{ env.HAS_PAT == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: |
          set -u
          owner="${REPO%%/*}"; name="${REPO##*/}"
          bot_id=$(gh api graphql -f query="query { repository(owner:\"$owner\", name:\"$name\") { suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 50) { nodes { login ... on Bot { id } } } } }" \
            --jq '.data.repository.suggestedActors.nodes[] | select(.login=="copilot-swe-agent") | .id' 2>/dev/null || true)
          issue_id=$(gh api "repos/$REPO/issues/$ISSUE" --jq .node_id 2>/dev/null || true)
          if [ -n "$bot_id" ] && [ -n "$issue_id" ] && \
             gh api graphql -f query="mutation { replaceActorsForAssignable(input: {assignableId: \"$issue_id\", actorIds: [\"$bot_id\"]}) { assignable { ... on Issue { number } } } }" >/dev/null 2>&1; then
            echo "status=assigned" >> "$GITHUB_OUTPUT"
          else
            echo "status=manual_handoff" >> "$GITHUB_OUTPUT"
          fi
        id: assignment
      - name: Record assignment status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.issue.outputs.number }}
          ASSIGNMENT_STATUS: ${{ steps.assignment.outputs.status }}
        run: |
          if [ "$ASSIGNMENT_STATUS" = "assigned" ]; then
            note="Agent assignment recorded. Inference and review are not complete until the agent produces its report."
          else
            note="Agent assignment was not completed; manual handoff is required. Inference and review have not run. Assigning the security-quality agent needs the ACTIONS_PAT secret, owned by a user with Copilot."
          fi
          gh issue comment "$ISSUE" --repo "$REPO" --body "$note"
