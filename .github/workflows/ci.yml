# CI for the shipshape kit itself: tests, lint, and the regression guard.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --upgrade pip pytest ruff
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Regression guard
        run: python tests/regressions.py
