# Publishes the marketing site in site/ to GitHub Pages at
# https://kevnev19.github.io/shipshape/ whenever the site changes on main,
# or by hand from the Actions tab. One-time setup: Settings -> Pages ->
# Build and deployment -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege at the top; the deploy job escalates only what Pages needs.
permissions:
  contents: read

# One deployment at a time, and never cancel one that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # The README-art generator in site/tools/ is a dev tool, not a page.
      - name: Assemble the site
        run: rsync -a --exclude tools/ site/ _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
