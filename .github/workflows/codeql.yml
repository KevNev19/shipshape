# What this is: CodeQL — GitHub's automatic security scanner. It reads the
# code on every push (and weekly) and reports vulnerable patterns under the
# repository's Security tab. Free on public repositories.
# Safe to edit: yes — shipshape will ask before overwriting your edits.
# managed-by: shipshape v0.1.0
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 6 * * 1"

# Least privilege at the top; the job escalates only what scanning needs.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: "python"
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
