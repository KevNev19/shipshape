<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="The course $shipshape-init follows, drawn as a chart: 1 Scan, 2 A few questions, 3 Preview, 4 Set up. Nothing changes before the preview. Scan: Reads your languages, package setup and how tests run. It only looks. A few questions: Five at most, about outcomes. What the scan knows is only confirmed. Preview: Every file it will add, and why. Files you already have are left alone. Set up: Writes exactly what you saw and switches on the commit guard.">
