<rect x="0.5" y="0.5" width="879" height="449" rx="8" fill="#040b14" stroke="#233649"/><line x1="1" y1="44" x2="879" y2="44" stroke="#1e3247"/>
<circle cx="24" cy="22" r="5" fill="#2a3e54"/>
<circle cx="40" cy="22" r="5" fill="#2a3e54"/>
<circle cx="56" cy="22" r="5" fill="#2a3e54"/>
<text x="84" y="26" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8a9db0" letter-spacing="0.8">my-project</text>
<text x="32" y="84" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f5c400">you&gt;</text>
<text x="85.088" y="84" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#dce6ee">$shipshape-init</text>
<text x="85.088" y="116" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#dce6ee">This looks like a Python project that uses pytest for its tests. Is that right?</text>
<text x="32" y="148" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f5c400">you&gt;</text>
<text x="85.088" y="148" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#dce6ee">yep. it's just me working on it</text>
<text x="85.088" y="180" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#dce6ee">Got it: solo, changes go straight to main, and checks run after each push.</text>
<text x="85.088" y="202" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#dce6ee">Here's the plan, and nothing you already have gets touched:</text>
<text x="102.784" y="234" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#9dbbff">.github/workflows/ci.yml</text>
<text x="368.224" y="234" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8a9db0">runs your tests on GitHub after each push to main</text>
<text x="102.784" y="256" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#9dbbff">.sdlc/hooks/secret-guard.sh</text>
<text x="368.224" y="256" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8a9db0">stops a commit that adds a key or credential file</text>
<text x="102.784" y="278" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#9dbbff">docs/sdlc/harness.md</text>
<text x="368.224" y="278" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#8a9db0">your working agreement, in plain English</text>
<text x="102.784" y="300" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#9dbbff">…</text>
<text x="85.088" y="332" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#dce6ee">Shall I go ahead?</text>
<text x="32" y="364" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f5c400">you&gt;</text>
<text x="85.088" y="364" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#dce6ee">go ahead</text>
<text x="85.088" y="396" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#7fe0a8">Done. Everything is written, and the secret guard is on for this copy.</text>
<text x="85.088" y="418" font-family="ShipMono, ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#dce6ee">Next step: commit these new files and push them to GitHub.</text>
<rect class="cursor" x="607.12" y="405" width="8.848" height="17" fill="#f5c400"/>
</svg>
