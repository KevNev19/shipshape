<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" role="img" aria-label="An example $shipshape-init conversation. Shipshape confirms the project uses pytest, asks who works on it, shows a plan that leaves existing files alone, and writes it on the go-ahead.">
<title>An example $shipshape-init conversation. Shipshape confirms the project uses pytest, asks who works on it, shows a plan that leaves existing files alone, and writes it on the go-ahead.</title>
